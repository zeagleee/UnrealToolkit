[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unreal-toolkit"
dynamic = ["version"]
description = "Command-line control of Unreal Engine for AI coding agents and scripts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["unreal-engine", "ue5", "unreal", "automation", "ai-agents", "claude-code", "gamedev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/zeagleee/UnrealToolkit"
Documentation = "https://github.com/zeagleee/UnrealToolkit#readme"
Changelog = "https://github.com/zeagleee/UnrealToolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/zeagleee/UnrealToolkit/issues"
Discussions = "https://github.com/zeagleee/UnrealToolkit/discussions"

[project.scripts]
ue = "ue:main"

[tool.setuptools]
py-modules = ["ue"]
# editor/, plugin/ and scripts/ ship inside the package as uetk/_editor, uetk/_plugin and uetk/_scripts;
# uetk.project.toolkit_path() finds them there (and beside uetk/ in a clone).
packages = ["uetk", "uetk._editor", "uetk._plugin", "uetk._scripts"]
include-package-data = false

[tool.setuptools.package-dir]
"uetk._editor" = "editor"
"uetk._plugin" = "plugin"
"uetk._scripts" = "scripts"

[tool.setuptools.package-data]
"uetk._editor" = ["*.py"]
"uetk._plugin" = ["**/*.uplugin", "**/*.cs", "**/*.h", "**/*.cpp"]
"uetk._scripts" = ["*.py"]

[tool.setuptools.dynamic]
version = { attr = "uetk.__version__" }

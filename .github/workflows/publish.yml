name: publish

# Runs when a GitHub release is published, or by hand: `gh workflow run publish.yml --ref vX.Y.Z`.
# Builds the sdist and wheel and attaches them to the release. Uploads them to PyPI only when the repository
# variable PYPI_PUBLISH is "true" (CONTRIBUTING.md, "Releasing").

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The version matches the tag
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import uetk; print(uetk.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::uetk.__version__ is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release-assets:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the sdist and wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/unreal-toolkit/
    permissions:
      id-token: write  # trusted publishing: PyPI checks this workflow's identity, no token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

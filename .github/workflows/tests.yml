name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile everything (catches syntax errors in the editor-side code the tests can't import)
        run: python -m compileall -q ue.py uetk editor scripts
      - name: Generated docs are up to date (python scripts/gen_docs.py rewrites them)
        run: python scripts/gen_docs.py --check
